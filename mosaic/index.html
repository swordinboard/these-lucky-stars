<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mosaic Galaxy — These Lucky Stars</title>
    <meta name="description" content="Interactive galaxy map for These Lucky Stars.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="topbar">
            <button id="menu-button" class="icon-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
                <span class="hamburger-icon" aria-hidden="true"></span>
            </button>
            <h1 class="site-title">Mosaic Galaxy</h1>
        </div>
        <div id="breadcrumb" class="breadcrumb"></div>
    </header>

    <main class="map-area">
        <svg id="galaxy-map" class="galaxy-map">
            <defs>
                <radialGradient id="sector-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#d27f27" stop-opacity="0.55" />
                    <stop offset="70%" stop-color="#d27f27" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#d27f27" stop-opacity="0.05" />
                </radialGradient>
            </defs>
            <g id="viewport"></g>
        </svg>
    </main>

    <footer id="details-panel" class="details-panel"></footer>

    <nav id="sidebar" class="sidebar" aria-hidden="true">
        <button id="sidebar-close" class="icon-button" type="button" aria-label="Close menu">×</button>
        <ul class="sidebar-links">
            <li><a href="https://theseluckystars.com">TLS Home</a></li>
        </ul>
    </nav>
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
